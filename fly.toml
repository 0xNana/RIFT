app = 'spring-beacon-2980'
primary_region = 'jnb'

[build]
  dockerfile = 'Dockerfile'

[env]
  RIFT_DATA_DIR = '/data'
  RIFT_HOST = '0.0.0.0'
  RIFT_PORT = '4179'

[[mounts]]
  source = 'rift_data'
  destination = '/data'

[http_service]
  internal_port = 4179
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = '60s'
    interval = '30s'
    method = 'GET'
    timeout = '5s'
    path = '/api/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
